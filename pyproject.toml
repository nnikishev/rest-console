[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "frontend/node_modules", "frontend/dist", "staticfiles"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Django must initialize before importing consumers and authentication middleware.
"config/asgi.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
